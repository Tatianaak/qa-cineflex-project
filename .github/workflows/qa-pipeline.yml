name: CineFlex QA CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Instalar dependencias del Backend
        working-directory: ./backend
        run: npm install

      - name: Iniciar servidor Backend de CineFlex en segundo plano
        working-directory: ./backend
        run: |
          node server.js &
          sleep 3

      - name: Verificar estado del Backend (Healthcheck)
        run: |
          curl -f http://localhost:3000/api/health || exit 1

      - name: Instalar Newman para ejecución de pruebas Postman
        run: npm install -g newman

      - name: Ejecutar pruebas automatizadas de API con Newman
        run: |
          newman run api_tests/CineFlex_API_Collection.json \
            -e api_tests/CineFlex_Environment.json \
            --reporters cli,json \
            --reporter-json-export api_tests/newman-results.json \
            --bail
